[package]
name = "wordpet"
version = "0.2.0"
description = "Idle English vocabulary game"
authors = ["lpcoutinho"]
edition = "2021"
rust-version = "1.95.0"

[lib]
name = "wordpet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = ["tray-icon"] }
